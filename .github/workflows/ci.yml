name: Production CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Run Automated Test Suite
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd mongosh
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Run Vitest Integration & Unit Tests
        env:
          NODE_ENV: test
          PORT: 5002
          MONGO_URI: mongodb://127.0.0.1:27017/ecommerce_test
          JWT_ACCESS_SECRET: github_actions_dummy_access_secret_for_tests_only
          JWT_REFRESH_SECRET: github_actions_dummy_refresh_secret_for_tests_only
          JWT_ACCESS_EXPIRATION: 15m
          JWT_REFRESH_EXPIRATION: 7d
          CORS_ORIGIN: '*'
          API_PREFIX: /api/v1
        run: npm test

  docker-build:
    name: Verify Docker Container Build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Production Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: ecommerce-backend:latest